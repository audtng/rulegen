rules:
  - id: GHSA-2fp4-5v5c-4448
    languages: [go]
    severity: WARNING
    message: "gonic: Path Traversal in playlist `id` bypasses ownership check, enabling any user to read/delete other users' playlists"
    metadata:
      cve: "CVE-2026-49339"
      ghsa: "GHSA-2fp4-5v5c-4448"
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $ABS := filepath.Join($S.$BASE, $REL)
          - pattern: return os.Remove(filepath.Join($S.$BASE, $REL))
