rules:
  - id: GHSA-4p3p-cr38-v5xp
    languages: [go]
    severity: WARNING
    message: "Omni is Vulnerable to DoS via Empty Create/Update Resource Requests"
    metadata:
      cve: "CVE-2025-59836"
      ghsa: "GHSA-4p3p-cr38-v5xp"
      confidence: HIGH
    patterns:
      - pattern: 'if $RESOURCE.Metadata.Version == ""'
      - pattern-not: 'if $RESOURCE == nil'
      - pattern-not: 'if $RESOURCE.Metadata == nil'
