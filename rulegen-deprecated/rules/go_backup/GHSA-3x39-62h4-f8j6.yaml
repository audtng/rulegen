rules:
  - id: GHSA-3x39-62h4-f8j6
    languages: [go]
    severity: WARNING
    message: "Mattermost fails to properly validate OAuth state tokens during OpenID Connect authentication"
    metadata:
      cve: "CVE-2025-12419"
      ghsa: "GHSA-3x39-62h4-f8j6"
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $EXTRA := generateOAuthStateTokenExtra($EMAIL, $ACTION, $COOKIE)
          - pattern: $EXTRA = generateOAuthStateTokenExtra($EMAIL, $ACTION, $COOKIE)
          - pattern: generateOAuthStateTokenExtra($EMAIL, $ACTION, $COOKIE) != $TOKEN.Extra
          - pattern: generateOAuthStateTokenExtra($EMAIL, $ACTION, $COOKIE) == $TOKEN.Extra
