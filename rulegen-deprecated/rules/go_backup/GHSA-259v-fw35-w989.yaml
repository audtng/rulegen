rules:
  - id: GHSA-259v-fw35-w989
    languages: [go]
    severity: WARNING
    message: "Insecure temporary file path construction: directly concatenating or joining paths to os.TempDir() produces predictable file paths that are vulnerable to symlink and race condition attacks. Use os.CreateTemp, os.MkdirTemp, or ioutil.TempDir instead."
    metadata:
      cve: "CVE-2012-2666"
      ghsa: "GHSA-259v-fw35-w989"
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: os.TempDir() + $X
          - pattern: $X + os.TempDir()
          - pattern: filepath.Join(os.TempDir(), ...)
          - pattern: path.Join(os.TempDir(), ...)
          - pattern: fmt.Sprintf($FMT, ..., os.TempDir(), ...)
