rules:
  - id: GHSA-3vcp-chfh-f6r2
    languages: [go]
    severity: WARNING
    message: "Default kuma-cp leaks admin token cross-origin via CORS wildcard + LocalhostIsAdmin"
    metadata:
      cve: "CVE-2026-45021"
      ghsa: "GHSA-3vcp-chfh-f6r2"
