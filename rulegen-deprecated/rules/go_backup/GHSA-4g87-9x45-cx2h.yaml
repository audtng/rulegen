rules:
  - id: GHSA-4g87-9x45-cx2h
    languages: [go]
    severity: WARNING
    message: "Mattermost fails to sanitize team email addresses"
    metadata:
      cve: "CVE-2025-12559"
      ghsa: "GHSA-4g87-9x45-cx2h"
      confidence: HIGH
    patterns:
      - pattern: "if $ERR := json.NewEncoder($W).Encode($DATA); $ERR != nil {"
      - pattern-not: "if $ERR := json.NewEncoder($W).Encode($APP.SanitizeTeams(...)); $ERR != nil {"
