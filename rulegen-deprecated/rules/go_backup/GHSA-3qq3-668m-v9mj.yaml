rules:
  - id: GHSA-3qq3-668m-v9mj
    languages: [go]
    severity: WARNING
    message: "Gogs has a Denial of Service in repository/wiki file listing web pages"
    metadata:
      cve: "CVE-2025-64719"
      ghsa: "GHSA-3qq3-668m-v9mj"
      confidence: HIGH
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $VAR, $ERR := $REPO.LsTree($SHA)
              - pattern-not: $VAR, $ERR := $REPO.LsTree($SHA, ...)
          - patterns:
              - pattern: $VAR, $ERR := $OBJ.Entries()
              - pattern-not: $VAR, $ERR := $OBJ.Entries(...)
