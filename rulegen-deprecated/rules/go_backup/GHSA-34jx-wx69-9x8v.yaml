rules:
  - id: GHSA-34jx-wx69-9x8v
    languages: [go]
    severity: WARNING
    message: "Symlink Attack in kubectl cp: directly creating symlink from archive header Linkname without path validation allows arbitrary file overwrite"
    metadata:
      cve: "CVE-2019-1002101"
      ghsa: "GHSA-34jx-wx69-9x8v"
      confidence: HIGH
    patterns:
      - pattern: os.Symlink($HEADER.Linkname, ...)
