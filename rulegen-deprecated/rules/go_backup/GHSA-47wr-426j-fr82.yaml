rules:
  - id: GHSA-47wr-426j-fr82
    languages: [go]
    severity: WARNING
    message: "Insecure tar extraction routine omits destination directory validation for unpacked files and symlinks"
    metadata:
      cve: "CVE-2020-26277"
      ghsa: "GHSA-47wr-426j-fr82"
      confidence: HIGH
    patterns:
      - pattern-inside: |
          func $FUNC(..., $DEST string, ...) ... {
            ...
          }
      - pattern: return unpackTarFiles($READER)
      - pattern-not: return unpackTarFiles($READER, $DEST)
