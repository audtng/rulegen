rules:
  - id: GHSA-25w9-wqfq-gwqx
    languages: [go]
    severity: WARNING
    message: "SiYuan has an arbitrary file read and path traversal via /api/export/exportResources"
    metadata:
      cve: "CVE-2024-55658"
      ghsa: "GHSA-25w9-wqfq-gwqx"
      confidence: HIGH
    patterns:
      - pattern: "$RESOURCEFULLPATH := filepath.Join(util.WorkspaceDir, $RESOURCEPATH)"
      - pattern-not: "util.IsAbsPathInWorkspace($PATH)"
