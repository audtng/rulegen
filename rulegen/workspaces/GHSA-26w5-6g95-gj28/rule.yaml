rules:
  - id: GHSA-26w5-6g95-gj28
    languages: [go]
    severity: WARNING
    message: "Atlantis Workspace Handling has Path Traversal that Allows Out-of-Bounds Directory Deletion/Creation"
    metadata:
      cve: "CVE-2026-64679"
      ghsa: "GHSA-26w5-6g95-gj28"
      confidence: HIGH
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $DIR := $W.cloneDir($REPO, $PULL, $WORKSPACE)
              - pattern-not: $DIR, $ERR := $W.cloneDir($REPO, $PULL, $WORKSPACE)
          - patterns:
              - pattern: $DIR = $W.cloneDir($REPO, $PULL, $WORKSPACE)
              - pattern-not: $DIR, $ERR = $W.cloneDir($REPO, $PULL, $WORKSPACE)
          - patterns:
              - pattern: $DIR := $W.repoPullDir($REPO, $PULL)
              - pattern-not: $DIR, $ERR := $W.repoPullDir($REPO, $PULL)
          - patterns:
              - pattern: $DIR = $W.repoPullDir($REPO, $PULL)
              - pattern-not: $DIR, $ERR = $W.repoPullDir($REPO, $PULL)
