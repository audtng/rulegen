rules:
  - id: GHSA-32qh-8vg6-9g43
    languages: [go]
    severity: WARNING
    message: "Cloud Foundry Archiver vulnerable to path traversal"
    metadata:
      cve: "CVE-2018-25046"
      ghsa: "GHSA-32qh-8vg6-9g43"
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $PATH := filepath.Join($DEST, $ENTRY.Name)
          - pattern: $PATH = filepath.Join($DEST, $ENTRY.Name)
