rules:
  - id: GHSA-45m3-398w-m2m9
    languages: [go]
    severity: WARNING
    message: "OliveTin has unauthenticated DoS via concurrent map writes in OAuth2 state handling"
    metadata:
      cve: "CVE-2026-28789"
      ghsa: "GHSA-45m3-398w-m2m9"
      confidence: HIGH
    patterns:
      - pattern: $SERVERSTATE, $FOUND := $H.registeredStates[$COOKIE.Value]
      - pattern-not: $USER, $FOUND := $H.lookupOAuth2UserByState($COOKIE.Value)
