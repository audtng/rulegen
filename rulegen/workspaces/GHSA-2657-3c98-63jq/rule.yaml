rules:
  - id: GHSA-2657-3c98-63jq
    languages: [go]
    severity: WARNING
    message: "esm.sh has a path traversal in extractPackageTarball enables file writes from malicious packages"
    metadata:
      cve: "CVE-2026-23644"
      ghsa: "GHSA-2657-3c98-63jq"
      confidence: HIGH
    patterns:
      - pattern: path.Join($DIR, $NAME)
      - pattern-not: path.Join($DIR, path.Clean(...))
