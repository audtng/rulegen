rules:
  - id: GHSA-3fp5-2xwh-fxm6
    languages: [go]
    severity: WARNING
    message: "Evmos transaction execution not accounting for all state transition after interaction with precompiles"
    metadata:
      cve: "CVE-2024-32644"
      ghsa: "GHSA-3fp5-2xwh-fxm6"
      confidence: HIGH
    patterns:
      - pattern: "$CTX, $STATE, $METHOD, $GAS, $ARGS, $ERR := $P.RunSetup($EVM, $CONTRACT, $READONLY, $P.IsTransaction)"
      - pattern-not: "if err := $STATE.Commit(); $ERR != nil"
