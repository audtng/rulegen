rules:
  - id: GHSA-26cm-qrc6-mfgj
    languages: [go]
    severity: WARNING
    message: "Improper Neutralization of Special Elements used in an LDAP Query in stevenweathers/thunderdome-planning-poker"
    metadata:
      cve: "CVE-2021-41232"
      ghsa: "GHSA-26cm-qrc6-mfgj"
      confidence: HIGH
    patterns:
      - pattern-inside: $REQ := ldap.NewSearchRequest(...)
      - pattern: fmt.Sprintf($FILTER, $USER)
      - pattern-not: fmt.Sprintf($FILTER, ldap.EscapeFilter($USER))
