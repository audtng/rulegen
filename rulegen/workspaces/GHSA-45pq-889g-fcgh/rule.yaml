rules:
  - id: GHSA-45pq-889g-fcgh
    languages: [go]
    severity: WARNING
    message: "rclone: Incomplete path validation allows backend root escape in serve restic"
    metadata:
      cve: "CVE-2026-71309"
      ghsa: "GHSA-45pq-889g-fcgh"
      confidence: HIGH
    patterns:
      - pattern: 'if $PATH != "" && path.Clean($PATH) != $PATH {'
      - pattern-not: 'if $PATH != "" && ($PATH == "." || !iofs.ValidPath($PATH)) {'
