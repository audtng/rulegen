rules:
  - id: GHSA-3w28-36p9-w929
    languages: [go]
    severity: WARNING
    message: "Gogs's Unauthenticated Jupyter Notebook (ipynb) Sanitizer allows arbitrary data: URIs leading to XSS"
    metadata:
      cve: "CVE-2026-52816"
      ghsa: "GHSA-3w28-36p9-w929"
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern-inside: |
              func $FUNC(...) $RET {
                ...
              }
          - pattern-inside: |
              func $FUNC(...) {
                ...
              }
          - pattern-inside: |
              func ($RECV $TYPE) $FUNC(...) $RET {
                ...
              }
          - pattern-inside: |
              func ($RECV $TYPE) $FUNC(...) {
                ...
              }
      - pattern-either:
          - pattern: $POLICY.AllowURLSchemes("data")
          - pattern: $POLICY.AllowURLSchemes("data", ...)
          - pattern: $POLICY.AllowURLSchemes(..., "data")
          - pattern: $POLICY.AllowURLSchemes(..., "data", ...)
