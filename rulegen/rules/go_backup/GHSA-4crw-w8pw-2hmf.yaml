rules:
  - id: GHSA-4crw-w8pw-2hmf
    languages: [go]
    severity: WARNING
    message: "Buildah (as part of Podman) vulnerable to Link Following"
    metadata:
      cve: "CVE-2022-4122"
      ghsa: "GHSA-4crw-w8pw-2hmf"
      confidence: HIGH
    patterns:
      - pattern-inside: |
          func $FUNC(..., $ROOT string, ...) ... {
            ...
          }
      - pattern-either:
          - pattern: os.ReadFile(filepath.Join($ROOT, ...))
          - pattern: ioutil.ReadFile(filepath.Join($ROOT, ...))
      - pattern-not-inside: |
          securejoin.SecureJoin(...)
          ...
