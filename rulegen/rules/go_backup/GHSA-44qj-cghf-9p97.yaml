rules:
  - id: GHSA-44qj-cghf-9p97
    languages: [go]
    severity: WARNING
    message: "free5GC's SMF UPI POST /upi/v1/upNodesLinks exits the SMF process on overlapping UE pools (unauthenticated, reachable Fatalf)"
    metadata:
      cve: "CVE-2026-44321"
      ghsa: "GHSA-44qj-cghf-9p97"
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern-inside: |
              func ($RECV *$TYPE) $FUNC(..., $PARAM *factory.UserPlaneInformation, ...) ... {
                ...
              }
          - pattern-inside: |
              func $FUNC(..., $PARAM *factory.UserPlaneInformation, ...) ... {
                ...
              }
      - pattern: $LOGGER.Fatalf(...)
