rules:
  - id: GHSA-2m9h-r57g-45pj
    languages: [go]
    severity: WARNING
    message: "Downloading malicious GitHub Actions workflow artifact results in path traversal vulnerability"
    metadata:
      cve: "CVE-2024-54132"
      ghsa: "GHSA-2m9h-r57g-45pj"
      confidence: HIGH
    patterns:
      - pattern: opts.Platform.Download(a.DownloadURL, destDir)
      - pattern-not: "!filepathDescendsFrom($A, $B)"
