rules:
  - id: GHSA-4gh8-x3vv-phhg
    languages: [go]
    severity: WARNING
    message: "Predictable SIF UUID Identifiers in github.com/sylabs/sif"
    metadata:
      cve: "CVE-2021-29499"
      ghsa: "GHSA-4gh8-x3vv-phhg"
      confidence: HIGH
    patterns:
      - pattern: $VAR := $EXPR
      - metavariable-pattern:
          metavariable: $EXPR
          patterns:
            - pattern: $UUID.NewV4()
      - pattern-not: $ID, $ERR := $EXPR
