rules:
  - id: GHSA-43mm-m3h2-3prc
    languages: [go]
    severity: WARNING
    message: "File Browser is vulnerable to username enumeration via timing attack in auth"
    metadata:
      cve: "CVE-2026-23849"
      ghsa: "GHSA-43mm-m3h2-3prc"
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $ERR != nil || !users.CheckPwd($PWD, $U.Password)
          - pattern: !users.CheckPwd($PWD, $U.Password) || $ERR != nil
