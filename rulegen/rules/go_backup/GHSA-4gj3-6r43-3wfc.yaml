rules:
  - id: GHSA-4gj3-6r43-3wfc
    languages: [go]
    severity: WARNING
    message: "IPFS go-unixfsnode subject to DOS via HAMT Decoding Panics"
    metadata:
      cve: "CVE-2023-23631"
      ghsa: "GHSA-4gj3-6r43-3wfc"
      confidence: HIGH
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $BF := bitField($DATA)
              - pattern-not: $BF, $ERR := bitField($DATA)
          - patterns:
              - pattern: $BM := bitfield.NewBitfield($SIZE)
              - pattern-not: $BM, $ERR := bitfield.NewBitfield($SIZE)
              - pattern-not-inside: |
                  if $COND {
                    ...
                  }
                  ...
                  $BM := bitfield.NewBitfield($SIZE)
