rules:
  - id: GHSA-4f99-4q7p-p3gh
    languages: [go]
    severity: WARNING
    message: "Logrus log entry spoofing/injection via CRLF in log formatting (CVE-2025-65637)"
    metadata:
      cve: "CVE-2025-65637"
      ghsa: "GHSA-4f99-4q7p-p3gh"
      confidence: HIGH
    patterns:
      - pattern-inside: |
          func ($ENTRY *$ENTRYTYPE) writerScanner($READER *io.PipeReader, $PRINTFUNC func(args ...interface{})) {
            ...
          }
      - pattern: $PRINTFUNC($SCANNER.Text())
      - pattern-not: $PRINTFUNC(strings.TrimRight($SCANNER.Text(), ...))
