rules:
  - id: GHSA-3v85-fqvh-7rxf
    languages: [go]
    severity: WARNING
    message: "Ech0's RSS feed renders unescaped tag names and raw-HTML markdown, stored XSS against subscribers"
    metadata:
      cve: ""
      ghsa: "GHSA-3v85-fqvh-7rxf"
      confidence: HIGH
    patterns:
      - pattern: $CONTENT = fmt.Appendf($CONTENT, ..., $TAG.Name)
      - pattern-not: $CONTENT = fmt.Appendf($CONTENT, ..., $PKG.EscapeString($TAG.Name))
