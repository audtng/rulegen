rules:
  - id: GHSA-2q89-485c-9j2x
    languages: [go]
    severity: WARNING
    message: "Improper random reading in CIRCL: using rand.Read instead of io.ReadFull or discarding cryptoRand.Read errors"
    metadata:
      cve: "CVE-2023-1732"
      ghsa: "GHSA-2q89-485c-9j2x"
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: _, err := rand.Read(seed)
          - pattern: _, err := random.Read(salt)
          - pattern: _, _ = cryptoRand.Read(seed[:])
