rules:
  - id: GHSA-4r5x-x283-wm96
    languages: [go]
    severity: WARNING
    message: "Jumpserver Koko vulnerable to remote code execution on the host system via MongoDB shell "
    metadata:
      cve: "CVE-2023-43651"
      ghsa: "GHSA-4r5x-x283-wm96"
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $LCMD, $ERR = localcommand.New($PROG, $ARGS, ...)
          - pattern: $LCMD, $ERR := localcommand.New($PROG, $ARGS, ...)
      - pattern-not-inside: |
          $OPTS, $ERR := BuildNobodyWithOpts(...)
          ...
      - pattern-not-inside: |
          $OPTS, $ERR = BuildNobodyWithOpts(...)
          ...
      - pattern-not: $LCMD, $ERR = localcommand.New($PROG, $ARGS, $OPTS...)
      - pattern-not: $LCMD, $ERR := localcommand.New($PROG, $ARGS, $OPTS...)
