rules:
  - id: GHSA-4qg8-fj49-pxjh
    languages: [go]
    severity: WARNING
    message: "Sigstore Timestamp Authority allocates excessive memory during request parsing"
    metadata:
      cve: "CVE-2025-66564"
      ghsa: "GHSA-4qg8-fj49-pxjh"
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $SPLIT := strings.Split($HEADER, "application/")
          - pattern: strings.Split($REQ.TSAPolicyOID, ".")
      - pattern-not: $SPLIT := strings.SplitN($HEADER, "application/", $N)
      - pattern-not: strings.SplitN($REQ.TSAPolicyOID, ".", $N)
