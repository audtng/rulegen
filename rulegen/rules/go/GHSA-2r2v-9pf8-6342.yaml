rules:
  - id: GHSA-2r2v-9pf8-6342
    languages: [go]
    severity: WARNING
    message: "WireGuard Portal v2 Vulnerable to OAuth Insecure Redirect URI / Account Takeover"
    metadata:
      ghsa: "GHSA-2r2v-9pf8-6342"
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: auth.NewAuthenticator(&cfg.Auth, eventBus, userManager)
          - pattern: fmt.Sprintf("%s/%s/init", a.cfg.CallbackUrlPrefix, providerId)
