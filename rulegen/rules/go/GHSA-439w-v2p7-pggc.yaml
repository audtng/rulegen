rules:
  - id: GHSA-439w-v2p7-pggc
    languages: [go]
    severity: WARNING
    message: "Juju has unauthorized access to out-of-scope Kubernetes secrets"
    metadata:
      cve: "CVE-2026-32693"
      ghsa: "GHSA-439w-v2p7-pggc"
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: $TOKEN, $ERR := $BROKER.ensureSecretAccessToken($CTX, $CONSUMER, $OWNED, $READ, $REMOVED)
          - pattern: $TOKEN, $ERR = $BROKER.ensureSecretAccessToken($CTX, $CONSUMER, $OWNED, $READ, $REMOVED)
          - pattern: _, $ERR = $BROKER.ensureSecretAccessToken($CTX, $CONSUMER, $OWNED, $READ, $REMOVED)
          - pattern: |
              func ($K *$CLIENT) ensureSecretAccessToken($CTX context.Context, $CONSUMER names.Tag, $OWNED, $READ, $REMOVED []string) (_ string, err error) {
                ...
              }
          - pattern: |
              func ($K *$CLIENT) ensureBindingForSecretAccessToken($CTX context.Context, $SA *core.ServiceAccount, $OWNED, $READ, $REMOVED []string) ($CLEANUPS []func(), _ error) {
                ...
              }
          - pattern: |
              func rulesForSecretAccess($NS string, $ISCTRL bool, $EXISTING []rbacv1.PolicyRule, $OWNED, $READ, $REMOVED []string) []rbacv1.PolicyRule {
                ...
              }
