rules:
  - id: GHSA-4c4x-jm2x-pf9j
    languages: [go]
    severity: WARNING
    message: "Rekor affected by Server-Side Request Forgery (SSRF) via provided public key URL"
    metadata:
      cve: "CVE-2026-24117"
      ghsa: "GHSA-4c4x-jm2x-pf9j"
      confidence: HIGH
    patterns:
      - pattern: $KEYREADER, $ERR := util.FileOrURLReadCloser($CTX, $PARAMS.Query.PublicKey.URL.String(), $PARAMS.Query.PublicKey.Content)
