rules:
  - id: GHSA-32h7-7j94-8fc2
    languages: [go]
    severity: WARNING
    message: "Mattermost vulnerable to denial of service via large number of emoji reactions"
    metadata:
      cve: "CVE-2024-1402"
      ghsa: "GHSA-32h7-7j94-8fc2"
      confidence: HIGH
    pattern-either:
      - pattern: reaction.EmojiName = "sad"
      - pattern: EmojiName: "smile-"
      - pattern: EmojiName: "smile_"
