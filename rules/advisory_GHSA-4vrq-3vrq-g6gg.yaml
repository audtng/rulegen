rules:
  - id: url-path-traversal-file-access
    mode: taint
    severity: ERROR
    languages:
      - go
    message: "Untrusted URL path or fragment component used in file system operation without validation, leading to potential path traversal."
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp:
        - "A01:2021 - Broken Access Control"
      category: security
      confidence: HIGH
      references:
        - "https://cwe.mitre.org/data/definitions/22.html"
        - "https://owasp.org/www-community/attacks/Path_Traversal"
    paths:
      exclude:
        - "*_test.go"
        - "test/**/*.go"
        - "mock/**/*.go"
    options:
      taint_assume_safe_booleans: true
    pattern-sources:
      - pattern: url.Parse(...)
      - pattern: url.ParseRequestURI(...)
      - pattern: "($U : *url.URL).Fragment"
      - pattern: "($U : *url.URL).Path"
      - pattern: "($U : *url.URL).RawPath"
      - pattern: "($U : *url.URL).RawQuery"
      - pattern: "($U : *url.URL).Query(...)"
      - pattern: "($U : *url.URL).EscapedPath(...)"
      - pattern: "($U : url.URL).Fragment"
      - pattern: "($U : url.URL).Path"
      - pattern: "($U : url.URL).RawPath"
      - pattern: "($U : url.URL).RawQuery"
      - pattern: "($U : url.URL).Query(...)"
      - pattern: "($U : url.URL).EscapedPath(...)"
    pattern-propagators:
      - from: $FROM
        to: filepath.Join(...)
        patterns:
          - pattern: filepath.Join(..., $FROM, ...)
      - from: $FROM
        to: path.Join(...)
        patterns:
          - pattern: path.Join(..., $FROM, ...)
      - from: $FROM
        to: filepath.Clean(...)
        patterns:
          - pattern: filepath.Clean($FROM)
      - from: $FROM
        to: path.Clean(...)
        patterns:
          - pattern: path.Clean($FROM)
      - from: $FROM
        to: filepath.FromSlash(...)
        patterns:
          - pattern: filepath.FromSlash($FROM)
      - from: $FROM
        to: filepath.ToSlash(...)
        patterns:
          - pattern: filepath.ToSlash($FROM)
      - from: $FROM
        to: fmt.Sprintf(...)
        patterns:
          - pattern: fmt.Sprintf(..., $FROM, ...)
      - from: $FROM
        to: strings.TrimPrefix(...)
        patterns:
          - pattern: strings.TrimPrefix($FROM, ...)
      - from: $FROM
        to: strings.TrimSuffix(...)
        patterns:
          - pattern: strings.TrimSuffix($FROM, ...)
    pattern-sanitizers:
      - pattern: filepath.Base(...)
      - pattern: path.Base(...)
      - by-side-effect: true
        patterns:
          - pattern: filepath.IsLocal($X)
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.Open($PATH)
              - pattern: os.OpenFile($PATH, ...)
              - pattern: os.Create($PATH)
              - pattern: os.ReadFile($PATH)
              - pattern: os.WriteFile($PATH, ...)
              - pattern: os.Remove($PATH)
              - pattern: os.RemoveAll($PATH)
              - pattern: os.ReadDir($PATH)
              - pattern: os.Stat($PATH)
              - pattern: os.Lstat($PATH)
              - pattern: os.Mkdir($PATH, ...)
              - pattern: os.MkdirAll($PATH, ...)
              - pattern: os.DirFS($PATH)
          - focus-metavariable: $PATH
