rules:
  - id: go-path-traversal-expanded
    mode: taint
    severity: ERROR
    message: Untrusted user input used in file system operation or returned from a path builder without proper validation, leading to path traversal.
    languages:
      - go
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp:
        - "A01:2021 - Broken Access Control"
      category: security
      confidence: HIGH
      impact: HIGH
      likelihood: MEDIUM
      subcategory: vuln
    paths:
      exclude:
        - "*_test.go"
        - "test/**/*.go"
        - "mock/**/*.go"
    options:
      taint_assume_safe_booleans: true
    pattern-sources:
      # net/http sources
      - pattern: "($REQ : *http.Request).URL.Query().Get(...)"
      - pattern: "($REQ : *http.Request).URL.Query()"
      - pattern: "($REQ : *http.Request).URL.Path"
      - pattern: "($REQ : *http.Request).URL.RawQuery"
      - pattern: "($REQ : *http.Request).FormValue(...)"
      - pattern: "($REQ : *http.Request).PostFormValue(...)"
      - pattern: "($REQ : *http.Request).Header.Get(...)"
      - pattern: "($REQ : *http.Request).Cookie(...)"
      - pattern: "($REQ : *http.Request).PathValue(...)"
      # Gin framework sources
      - pattern: "(*gin.Context).Query(...)"
      - pattern: "(*gin.Context).Param(...)"
      - pattern: "(*gin.Context).PostForm(...)"
      - pattern: "(*gin.Context).FormFile(...)"
      - pattern: "(*gin.Context).GetHeader(...)"
      - pattern: "(*gin.Context).Cookie(...)"
      # Echo framework sources
      - pattern: "(echo.Context).FormValue(...)"
      - pattern: "(echo.Context).QueryParam(...)"
      - pattern: "(echo.Context).Param(...)"
      - pattern: "(echo.Context).Cookie(...)"
      # Fiber framework sources
      - pattern: "(*fiber.Ctx).Query(...)"
      - pattern: "(*fiber.Ctx).Params(...)"
      - pattern: "(*fiber.Ctx).FormValue(...)"
      - pattern: "(*fiber.Ctx).Cookies(...)"
      # ----- NEW: Internal Storage Adapter Sources -----
      - pattern: "($PTR : block.ObjectPointer).StorageNamespace"
      - pattern: "($PTR : block.ObjectPointer).Identifier"
    pattern-propagators:
      - from: $FROM
        to: filepath.Join(...)
        patterns:
          - pattern: filepath.Join(..., $FROM, ...)
      - from: $FROM
        to: path.Join(...)
        patterns:
          - pattern: path.Join(..., $FROM, ...)
      - from: $FROM
        to: filepath.Clean(...)
        patterns:
          - pattern: filepath.Clean($FROM)
      - from: $FROM
        to: path.Clean(...)
        patterns:
          - pattern: path.Clean($FROM)
    pattern-sanitizers:
      - pattern: filepath.Base(...)
      - pattern: path.Base(...)
      - by-side-effect: true
        patterns:
          - pattern: filepath.IsLocal($X)
          - focus-metavariable: $X
      - by-side-effect: true
        patterns:
          - pattern: io/fs.ValidPath($X)
          - focus-metavariable: $X
      # Validates that the path separator is explicitly checked to prevent prefix bypass
      - by-side-effect: true
        patterns:
          - pattern: strings.HasPrefix($X, $BASE + string(filepath.Separator))
          - focus-metavariable: $X
      - by-side-effect: true
        patterns:
          - pattern: strings.HasPrefix($X, $BASE + "/")
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              # Filesystem Sinks
              - pattern: os.Open($PATH)
              - pattern: os.OpenFile($PATH, ...)
              - pattern: os.Create($PATH)
              - pattern: os.ReadFile($PATH)
              - pattern: os.WriteFile($PATH, ...)
              - pattern: os.Remove($PATH)
              - pattern: os.RemoveAll($PATH)
              - pattern: os.ReadDir($PATH)
              - pattern: os.Mkdir($PATH, ...)
              - pattern: os.MkdirAll($PATH, ...)
              # Web Framework File Sinks
              - pattern: "(*gin.Context).File($PATH)"
              - pattern: "(echo.Context).File($PATH)"
              - pattern: "(*fiber.Ctx).SendFile($PATH, ...)"
              # ----- NEW: Helper Method Return Sinks -----
              # Catches helper functions returning tainted, unvalidated paths
              - pattern: return $PATH, ...
              - pattern: return ..., $PATH
          - focus-metavariable: $PATH
