rules:
  - id: go-path-traversal-file-read
    mode: taint
    severity: ERROR
    languages:
      - go
    message: >-
      Untrusted user input flows into a file system access sink without proper path traversal validation.
      An attacker could use directory traversal sequences (such as '../') to access arbitrary files and disclose sensitive secrets outside the target directory.
      Validate paths using real containment checks like filepath.IsLocal (Go 1.20+) or io/fs.ValidPath rather than lexical cleaners like filepath.Join or filepath.Clean alone.
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
        - "CWE-200: Exposure of Sensitive Information to an Unauthorized Actor"
      owasp:
        - "A01:2021 - Broken Access Control"
        - "A05:2017 - Broken Access Control"
      category: security
      technology:
        - go
      references:
        - "https://cwe.mitre.org/data/definitions/22.html"
        - "https://pkg.go.dev/path/filepath#IsLocal"
        - "https://pkg.go.dev/io/fs#ValidPath"
    paths:
      exclude: ["*_test.go", "test/**/*.go", "mock/**/*.go"]
    options:
      taint_assume_safe_booleans: true
      taint_assume_safe_numbers: true
    pattern-sources:
      - pattern: '($REQ : *http.Request).URL.Query().Get(...)'
      - pattern: '($REQ : *http.Request).URL.Query()[...]'
      - pattern: '($REQ : *http.Request).FormValue(...)'
      - pattern: '($REQ : *http.Request).PostFormValue(...)'
      - pattern: '($REQ : *http.Request).Form[...]'
      - pattern: '($REQ : *http.Request).PostForm[...]'
      - pattern: '($REQ : *http.Request).Header.Get(...)'
      - pattern: '($REQ : *http.Request).PathValue(...)'
      - pattern: '($CTX : *gin.Context).Query(...)'
      - pattern: '($CTX : *gin.Context).Param(...)'
      - pattern: '($CTX : *gin.Context).PostForm(...)'
      - pattern: '($CTX : echo.Context).FormValue(...)'
      - pattern: '($CTX : echo.Context).QueryParam(...)'
      - pattern: '($CTX : echo.Context).Param(...)'
      - pattern: '($CTX : *fiber.Ctx).Query(...)'
      - pattern: '($CTX : *fiber.Ctx).Params(...)'
      - pattern: '($CTX : *fiber.Ctx).FormValue(...)'
    pattern-propagators:
      - from: $FROM
        to: $TO
        patterns:
          - pattern-either:
              - pattern: $TO = filepath.Join(..., $FROM, ...)
              - pattern: $TO = filepath.Clean($FROM)
              - pattern: $TO = path.Join(..., $FROM, ...)
              - pattern: $TO = path.Clean($FROM)
              - pattern: $TO = fmt.Sprintf(..., $FROM, ...)
              - pattern: $TO = strings.TrimPrefix($FROM, ...)
              - pattern: $TO = strings.TrimSuffix($FROM, ...)
              - pattern: $TO = strings.TrimSpace($FROM)
    pattern-sanitizers:
      - by-side-effect: true
        patterns:
          - pattern: filepath.IsLocal($VAR)
          - focus-metavariable: $VAR
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: fs.ValidPath($VAR)
              - pattern: io.fs.ValidPath($VAR)
          - focus-metavariable: $VAR
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.Open($PATH)
              - pattern: os.OpenFile($PATH, ...)
              - pattern: os.ReadFile($PATH)
              - pattern: os.ReadDir($PATH)
              - pattern: os.Create($PATH)
              - pattern: os.WriteFile($PATH, ...)
              - pattern: os.DirFS($PATH)
              - pattern: http.Dir($PATH)
              - pattern: http.ServeFile($W, $REQ, $PATH)
              - pattern: ioutil.ReadFile($PATH)
          - focus-metavariable: $PATH
