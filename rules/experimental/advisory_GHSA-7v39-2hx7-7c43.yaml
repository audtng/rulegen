rules:
  - id: archive-zipslip-path-traversal
    mode: taint
    severity: ERROR
    message: "Potential ZipSlip / path traversal vulnerability extracting archive entry without path sanitization"
    languages:
      - go
    metadata:
      category: security
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp:
        - "A01:2021 - Broken Access Control"
      technology:
        - go
      subcategory:
        - vuln
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      references:
        - "https://cwe.mitre.org/data/definitions/22.html"
        - "https://owasp.org/www-community/attacks/Path_Traversal"
        - "https://snyk.io/research/zip-slip-vulnerability"
    paths:
      exclude:
        - "*_test.go"
        - "test/**/*.go"
        - "mock/**/*.go"
    options:
      taint_assume_safe_booleans: true
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: "($F : *zip.File).Name"
              - pattern: "($F : zip.File).Name"
              - pattern: "($FH : *zip.FileHeader).Name"
              - pattern: "($FH : zip.FileHeader).Name"
              - pattern: "($H : *tar.Header).Name"
              - pattern: "($H : tar.Header).Name"
              - pattern: "($R : *zip.Reader).File"
              - pattern: "($R : *zip.ReadCloser).File"
              - pattern: "($TR : *tar.Reader).Next()"
              - pattern: zip.OpenReader(...)
              - pattern: zip.NewReader(...)
              - pattern: tar.NewReader(...)
    pattern-propagators:
      - from: $FROM
        to: filepath.Join(...)
        patterns:
          - pattern: filepath.Join(..., $FROM, ...)
      - from: $FROM
        to: filepath.Clean(...)
        patterns:
          - pattern: filepath.Clean($FROM)
      - from: $FROM
        to: fmt.Sprintf(...)
        patterns:
          - pattern: fmt.Sprintf(..., $FROM, ...)
    pattern-sanitizers:
      - pattern: filepath.Base(...)
      - by-side-effect: true
        patterns:
          - pattern: filepath.IsLocal($X)
          - focus-metavariable: $X
      - by-side-effect: true
        patterns:
          - pattern: filepath.Rel($BASE, $X)
          - focus-metavariable: $X
      - by-side-effect: true
        patterns:
          - pattern: strings.HasPrefix($X, ...)
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.OpenFile($PATH, ...)
              - pattern: os.Create($PATH)
              - pattern: os.WriteFile($PATH, ...)
              - pattern: os.Open($PATH)
              - pattern: os.ReadFile($PATH)
              - pattern: os.Mkdir($PATH, ...)
              - pattern: os.MkdirAll($PATH, ...)
              - pattern: os.Remove($PATH)
              - pattern: os.RemoveAll($PATH)
          - focus-metavariable: $PATH
