rules:
  - id: go-unmarshaled-path-traversal
    mode: taint
    severity: ERROR
    message: >-
      Untrusted file path derived from unmarshaled configuration data is used directly in
      a file system operation without proper validation or sanitization. This can allow an
      attacker to read, write, or delete arbitrary files on the host via directory traversal.
      Validate that the target path remains within an authorized root directory using filepath.IsLocal
      or filepath.Rel before performing file operations.
    languages:
      - go
    metadata:
      category: security
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp:
        - "A01:2021 - Broken Access Control"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      references:
        - https://cwe.mitre.org/data/definitions/22.html
        - https://owasp.org/www-community/attacks/Path_Traversal
    paths:
      exclude:
        - "*_test.go"
        - "test/**/*.go"
        - "mock/**/*.go"
    options:
      taint_assume_safe_booleans: true
    pattern-sources:
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: json.Unmarshal($DATA, &$TARGET)
              - pattern: yaml.Unmarshal($DATA, &$TARGET)
              - pattern: xml.Unmarshal($DATA, &$TARGET)
          - focus-metavariable: $TARGET
    pattern-propagators:
      - from: $FROM
        to: filepath.Join(...)
        patterns:
          - pattern: filepath.Join(..., $FROM, ...)
      - from: $FROM
        to: filepath.Clean(...)
        patterns:
          - pattern: filepath.Clean($FROM)
      - from: $FROM
        to: filepath.Abs(...)
        patterns:
          - pattern: filepath.Abs($FROM)
    pattern-sanitizers:
      - pattern: filepath.Base(...)
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: filepath.IsLocal($X)
              - pattern: fs.ValidPath($X)
              - pattern: io/fs.ValidPath($X)
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.Open($PATH)
              - pattern: os.OpenFile($PATH, ...)
              - pattern: os.ReadFile($PATH)
              - pattern: os.WriteFile($PATH, ...)
              - pattern: os.Create($PATH)
              - pattern: os.Remove($PATH)
              - pattern: os.RemoveAll($PATH)
              - pattern: os.ReadDir($PATH)
              - pattern: os.DirFS($PATH)
          - focus-metavariable: $PATH
