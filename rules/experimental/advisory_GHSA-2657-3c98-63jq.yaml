rules:
  - id: go-archive-path-traversal
    mode: taint
    severity: ERROR
    message: "Untrusted archive entry path used in file operations without validation, leading to path traversal (Zip Slip)."
    languages:
      - go
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp:
        - "A01:2021 - Broken Access Control"
      category: security
      confidence: HIGH
      impact: HIGH
      likelihood: MEDIUM
      references:
        - "https://cwe.mitre.org/data/definitions/22.html"
        - "https://snyk.io/research/zip-slip-vulnerability"
        - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
    paths:
      exclude:
        - "*_test.go"
        - "test/**/*.go"
        - "mock/**/*.go"
    options:
      taint_assume_safe_booleans: true
    pattern-sources:
      - pattern: "($H : *tar.Header).Name"
      - pattern: "($H : tar.Header).Name"
      - pattern: "($H : *tar.Header).Linkname"
      - pattern: "($H : tar.Header).Linkname"
      - pattern: "($F : *zip.File).Name"
      - pattern: "($F : zip.File).Name"
      - pattern: "($F : *zip.FileHeader).Name"
      - pattern: "($F : zip.FileHeader).Name"
      - pattern: "($TR : *tar.Reader).Next()"
      - pattern: "($TR : tar.Reader).Next()"
      - pattern: "($ZR : *zip.Reader).File"
      - pattern: "($ZR : zip.Reader).File"
      - pattern: "($ZR : *zip.ReadCloser).File"
      - pattern: "($ZR : zip.ReadCloser).File"
      - patterns:
          - pattern: $TR.Next()
          - pattern-either:
              - pattern-inside: |
                  $TR, ... := tar.NewReader(...)
                  ...
              - pattern-inside: |
                  $TR, ... = tar.NewReader(...)
                  ...
      - patterns:
          - pattern: $ZR.File
          - pattern-either:
              - pattern-inside: |
                  $ZR, ... := zip.OpenReader(...)
                  ...
              - pattern-inside: |
                  $ZR, ... := zip.NewReader(...)
                  ...
              - pattern-inside: |
                  $ZR, ... = zip.OpenReader(...)
                  ...
              - pattern-inside: |
                  $ZR, ... = zip.NewReader(...)
                  ...
    pattern-propagators:
      - from: $FROM
        to: filepath.Join(...)
        patterns:
          - pattern: filepath.Join(..., $FROM, ...)
      - from: $FROM
        to: path.Join(...)
        patterns:
          - pattern: path.Join(..., $FROM, ...)
      - from: $FROM
        to: filepath.Clean(...)
        patterns:
          - pattern: filepath.Clean($FROM)
      - from: $FROM
        to: path.Clean(...)
        patterns:
          - pattern: path.Clean($FROM)
      - from: $FROM
        to: fmt.Sprintf(...)
        patterns:
          - pattern: fmt.Sprintf(..., $FROM, ...)
    pattern-sanitizers:
      - pattern: filepath.Base(...)
      - pattern: path.Base(...)
      - by-side-effect: true
        patterns:
          - pattern: filepath.IsLocal($X)
          - focus-metavariable: $X
      - by-side-effect: true
        patterns:
          - pattern: strings.HasPrefix($TARGET, ...)
          - focus-metavariable: $TARGET
      - by-side-effect: true
        patterns:
          - pattern: filepath.Rel(..., $TARGET)
          - focus-metavariable: $TARGET
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.OpenFile($PATH, ...)
              - pattern: os.Create($PATH)
              - pattern: os.WriteFile($PATH, ...)
              - pattern: os.Mkdir($PATH, ...)
              - pattern: os.MkdirAll($PATH, ...)
              - pattern: os.Remove($PATH)
              - pattern: os.RemoveAll($PATH)
              - pattern: os.Truncate($PATH, ...)
              - pattern: os.Symlink(..., $PATH)
              - pattern: os.Link(..., $PATH)
              - pattern: ioutil.WriteFile($PATH, ...)
          - focus-metavariable: $PATH
