rules:
  - id: path-traversal-unmarshaled-file
    mode: taint
    severity: ERROR
    message: >-
      Unsanitized path originating from unmarshaled configuration data passed to a file operation.
      This may lead to path traversal vulnerabilities (CWE-22) if an attacker can manipulate configuration files.
    languages:
      - go
    paths:
      exclude:
        - "*_test.go"
        - "test/**/*.go"
        - "mock/**/*.go"
    options:
      taint_assume_safe_booleans: true
    metadata:
      category: security
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
        - "CWE-36: Absolute Path Traversal"
      owasp:
        - "A01:2021 - Broken Access Control"
        - "A05:2017 - Broken Access Control"
      references:
        - "https://cwe.mitre.org/data/definitions/22.html"
        - "https://cwe.mitre.org/data/definitions/36.html"
        - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
      confidence: MEDIUM
      likelihood: HIGH
      impact: HIGH
      subcategory:
        - vuln
      technology:
        - go
        - yaml
        - json
        - xml
    pattern-sources:
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: json.Unmarshal($DATA, &$TARGET)
              - pattern: yaml.Unmarshal($DATA, &$TARGET)
              - pattern: xml.Unmarshal($DATA, &$TARGET)
          - focus-metavariable: $TARGET
    pattern-propagators:
      - from: $FROM
        to: filepath.Join(...)
        patterns:
          - pattern: filepath.Join(..., $FROM, ...)
      - from: $FROM
        to: path.Join(...)
        patterns:
          - pattern: path.Join(..., $FROM, ...)
      - from: $FROM
        to: filepath.Clean(...)
        patterns:
          - pattern: filepath.Clean($FROM)
      - from: $FROM
        to: path.Clean(...)
        patterns:
          - pattern: path.Clean($FROM)
      - from: $FROM
        to: fmt.Sprintf(...)
        patterns:
          - pattern: fmt.Sprintf(..., $FROM, ...)
    pattern-sanitizers:
      - pattern: filepath.Base(...)
      - pattern: path.Base(...)
      - by-side-effect: true
        patterns:
          - pattern: filepath.IsLocal($X)
          - focus-metavariable: $X
      - by-side-effect: true
        patterns:
          - pattern: fs.ValidPath($X)
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.OpenFile($PATH, ...)
              - pattern: os.Open($PATH)
              - pattern: os.Create($PATH)
              - pattern: os.ReadFile($PATH)
              - pattern: os.WriteFile($PATH, ...)
              - pattern: os.Remove($PATH)
              - pattern: os.RemoveAll($PATH)
              - pattern: os.ReadDir($PATH)
              - pattern: os.Mkdir($PATH, ...)
              - pattern: os.MkdirAll($PATH, ...)
              - pattern: os.Stat($PATH)
              - pattern: os.Lstat($PATH)
              - pattern: os.DirFS($PATH)
              - pattern: ioutil.ReadFile($PATH)
              - pattern: ioutil.WriteFile($PATH, ...)
              - pattern: http.Dir($PATH)
          - focus-metavariable: $PATH
