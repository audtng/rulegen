rules:
  - id: url-path-traversal
    mode: taint
    severity: ERROR
    message: "Untrusted URL component used in file system operation without path sanitization can lead to path traversal."
    languages:
      - go
    options:
      taint_assume_safe_booleans: true
    paths:
      exclude:
        - "*_test.go"
        - "test/**/*.go"
        - "mock/**/*.go"
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp:
        - "A01:2021 - Broken Access Control"
        - "A05:2017 - Broken Access Control"
      category: security
      technology:
        - go
      confidence: HIGH
      subcategory:
        - vuln
      likelihood: MEDIUM
      impact: HIGH
      references:
        - "https://cwe.mitre.org/data/definitions/22.html"
        - "https://owasp.org/Top10/A01_2021-Broken_Access_Control/"
    pattern-sources:
      - pattern: url.Parse(...)
      - pattern: url.ParseRequestURI(...)
      - pattern: url.ParseQuery(...)
      - pattern: "($U : *url.URL)"
      - pattern: "($U : url.URL)"
    pattern-propagators:
      - from: $FROM
        to: filepath.Join(...)
        patterns:
          - pattern: filepath.Join(..., $FROM, ...)
      - from: $FROM
        to: path.Join(...)
        patterns:
          - pattern: path.Join(..., $FROM, ...)
      - from: $FROM
        to: path.Clean(...)
        patterns:
          - pattern: path.Clean($FROM)
      - from: $FROM
        to: filepath.Clean(...)
        patterns:
          - pattern: filepath.Clean($FROM)
      - from: $FROM
        to: filepath.FromSlash(...)
        patterns:
          - pattern: filepath.FromSlash($FROM)
      - from: $FROM
        to: filepath.ToSlash(...)
        patterns:
          - pattern: filepath.ToSlash($FROM)
      - from: $FROM
        to: strings.TrimPrefix(...)
        patterns:
          - pattern: strings.TrimPrefix($FROM, ...)
      - from: $FROM
        to: strings.TrimSuffix(...)
        patterns:
          - pattern: strings.TrimSuffix($FROM, ...)
    pattern-sanitizers:
      - pattern: filepath.Base(...)
      - pattern: securejoin.SecureJoin(...)
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: filepath.IsLocal($X)
              - pattern: fs.ValidPath($X)
              - pattern: io/fs.ValidPath($X)
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.Open($PATH)
              - pattern: os.OpenFile($PATH, ...)
              - pattern: os.ReadFile($PATH)
              - pattern: os.WriteFile($PATH, ...)
              - pattern: os.Create($PATH)
              - pattern: os.CreateTemp($PATH, ...)
              - pattern: os.Remove($PATH)
              - pattern: os.RemoveAll($PATH)
              - pattern: os.ReadDir($PATH)
              - pattern: os.Stat($PATH)
              - pattern: os.Lstat($PATH)
              - pattern: os.Truncate($PATH, ...)
              - pattern: os.Chmod($PATH, ...)
              - pattern: os.Mkdir($PATH, ...)
              - pattern: os.MkdirAll($PATH, ...)
              - pattern: os.DirFS($PATH)
              - pattern: ioutil.ReadFile($PATH)
              - pattern: ioutil.WriteFile($PATH, ...)
              - pattern: ioutil.ReadDir($PATH)
              - pattern: filepath.Walk($PATH, ...)
              - pattern: filepath.WalkDir($PATH, ...)
          - focus-metavariable: $PATH
