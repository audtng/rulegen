rules:
  - id: jwt-unverified-token-authentication
    mode: search
    languages:
      - go
    severity: ERROR
    message: "Detected improper JWT authentication or missing error validation. Discarding parsing errors, failing to check token validity, using unverified parsing, or continuing execution after authentication failures allows unauthorized requests to bypass access controls."
    metadata:
      cwe:
        - "CWE-287: Improper Authentication"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      category: security
      confidence: HIGH
      references:
        - "https://cwe.mitre.org/data/definitions/287.html"
        - "https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/"
    paths:
      exclude:
        - "*_test.go"
        - "test/**/*.go"
        - "mock/**/*.go"
    patterns:
      - pattern-either:
          - pattern: $PARSER.ParseUnverified(...)
          - pattern: jwt.ParseUnverified(...)
          - pattern: $TOKEN, _ := jwt.Parse(...)
          - pattern: $TOKEN, _ = jwt.Parse(...)
          - pattern: $TOKEN, _ := jwt.ParseWithClaims(...)
          - pattern: $TOKEN, _ = jwt.ParseWithClaims(...)
          - pattern: $TOKEN, _ := $PARSER.Parse(...)
          - pattern: $TOKEN, _ = $PARSER.Parse(...)
          - pattern: $TOKEN, _ := $PARSER.ParseWithClaims(...)
          - pattern: $TOKEN, _ = $PARSER.ParseWithClaims(...)
          - pattern: _, _ = jwt.Parse(...)
          - pattern: _, _ = jwt.ParseWithClaims(...)
          - pattern: |
              jwt.Parse($TOKEN, func($T *jwt.Token) (interface{}, error) {
                  return []byte(""), nil
              })
          - pattern: |
              jwt.ParseWithClaims($TOKEN, $CLAIMS, func($T *jwt.Token) (interface{}, error) {
                  return []byte(""), nil
              })
          - patterns:
              - pattern-either:
                  - pattern: $TOKEN, $ERR := jwt.Parse(...)
                  - pattern: $TOKEN, $ERR = jwt.Parse(...)
                  - pattern: $TOKEN, $ERR := jwt.ParseWithClaims(...)
                  - pattern: $TOKEN, $ERR = jwt.ParseWithClaims(...)
                  - pattern: $TOKEN, $ERR := $PARSER.Parse(...)
                  - pattern: $TOKEN, $ERR = $PARSER.Parse(...)
                  - pattern: $TOKEN, $ERR := $PARSER.ParseWithClaims(...)
                  - pattern: $TOKEN, $ERR = $PARSER.ParseWithClaims(...)
              - pattern-not-inside: |
                  $TOKEN, $ERR := ...
                  ...
                  if $ERR != nil { ... }
              - pattern-not-inside: |
                  $TOKEN, $ERR = ...
                  ...
                  if $ERR != nil { ... }
              - pattern-not-inside: |
                  $TOKEN, $ERR := ...
                  ...
                  if $ERR == nil { ... }
              - pattern-not-inside: |
                  $TOKEN, $ERR = ...
                  ...
                  if $ERR == nil { ... }
              - pattern-not-inside: |
                  $TOKEN, $ERR := ...
                  ...
                  return ...
              - pattern-not-inside: |
                  $TOKEN, $ERR = ...
                  ...
                  return ...
          - patterns:
              - pattern: |
                  if $ERR != nil {
                      ...
                      http.Error($W, $MSG, $CODE)
                      ...
                  }
              - pattern-either:
                  - pattern-inside: |
                      $TOKEN, $ERR := jwt.Parse(...)
                      ...
                  - pattern-inside: |
                      $TOKEN, $ERR = jwt.Parse(...)
                      ...
                  - pattern-inside: |
                      $TOKEN, $ERR := jwt.ParseWithClaims(...)
                      ...
                  - pattern-inside: |
                      $TOKEN, $ERR = jwt.ParseWithClaims(...)
                      ...
                  - pattern-inside: |
                      $TOKEN, $ERR := $PARSER.Parse(...)
                      ...
                  - pattern-inside: |
                      $TOKEN, $ERR = $PARSER.Parse(...)
                      ...
                  - pattern-inside: |
                      $TOKEN, $ERR := $PARSER.ParseWithClaims(...)
                      ...
                  - pattern-inside: |
                      $TOKEN, $ERR = $PARSER.ParseWithClaims(...)
                      ...
              - pattern-not: |
                  if $ERR != nil {
                      ...
                      return ...
                  }
              - metavariable-regex:
                  metavariable: $CODE
                  regex: ^(http\.StatusUnauthorized|http\.StatusForbidden|401|403)$
          - patterns:
              - pattern: |
                  if $ERR != nil {
                      ...
                      $W.WriteHeader($CODE)
                      ...
                  }
              - pattern-either:
                  - pattern-inside: |
                      $TOKEN, $ERR := jwt.Parse(...)
                      ...
                  - pattern-inside: |
                      $TOKEN, $ERR = jwt.Parse(...)
                      ...
                  - pattern-inside: |
                      $TOKEN, $ERR := jwt.ParseWithClaims(...)
                      ...
                  - pattern-inside: |
                      $TOKEN, $ERR = jwt.ParseWithClaims(...)
                      ...
                  - pattern-inside: |
                      $TOKEN, $ERR := $PARSER.Parse(...)
                      ...
                  - pattern-inside: |
                      $TOKEN, $ERR = $PARSER.Parse(...)
                      ...
                  - pattern-inside: |
                      $TOKEN, $ERR := $PARSER.ParseWithClaims(...)
                      ...
                  - pattern-inside: |
                      $TOKEN, $ERR = $PARSER.ParseWithClaims(...)
                      ...
              - pattern-not: |
                  if $ERR != nil {
                      ...
                      return ...
                  }
              - metavariable-regex:
                  metavariable: $CODE
                  regex: ^(http\.StatusUnauthorized|http\.StatusForbidden|401|403)$
          - patterns:
              - pattern: |
                  if ! $TOKEN.Valid {
                      ...
                      http.Error($W, $MSG, $CODE)
                      ...
                  }
              - pattern-not: |
                  if ! $TOKEN.Valid {
                      ...
                      return ...
                  }
              - metavariable-regex:
                  metavariable: $CODE
                  regex: ^(http\.StatusUnauthorized|http\.StatusForbidden|401|403)$
          - patterns:
              - pattern: |
                  if ! $TOKEN.Valid {
                      ...
                      $W.WriteHeader($CODE)
                      ...
                  }
              - pattern-not: |
                  if ! $TOKEN.Valid {
                      ...
                      return ...
                  }
              - metavariable-regex:
                  metavariable: $CODE
                  regex: ^(http\.StatusUnauthorized|http\.StatusForbidden|401|403)$
