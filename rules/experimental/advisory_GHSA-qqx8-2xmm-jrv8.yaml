rules:
  - id: path-traversal-file-write
    mode: taint
    severity: ERROR
    message: "Untrusted input unmarshaled from structured data is used in a file path without sufficient validation, leading to path traversal."
    languages:
      - go
    metadata:
      category: security
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp:
        - "A01:2021 - Broken Access Control"
      confidence: HIGH
      subcategory:
        - vuln
      impact: HIGH
      likelihood: MEDIUM
      references:
        - https://cwe.mitre.org/data/definitions/22.html
        - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
    paths:
      exclude:
        - "*_test.go"
        - "test/**/*.go"
        - "mock/**/*.go"
    options:
      taint_assume_safe_booleans: true
    pattern-sources:
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: json.Unmarshal($DATA, &$TARGET)
              - pattern: yaml.Unmarshal($DATA, &$TARGET)
          - focus-metavariable: $TARGET
    pattern-propagators:
      - from: $FROM
        to: filepath.Join(...)
        patterns:
          - pattern: filepath.Join(..., $FROM, ...)
      - from: $FROM
        to: path.Join(...)
        patterns:
          - pattern: path.Join(..., $FROM, ...)
      - from: $FROM
        to: filepath.Clean(...)
        patterns:
          - pattern: filepath.Clean($FROM)
      - from: $FROM
        to: fmt.Sprintf(...)
        patterns:
          - pattern: fmt.Sprintf(..., $FROM, ...)
    pattern-sanitizers:
      - pattern: filepath.Base(...)
      - pattern: path.Base(...)
      - by-side-effect: true
        patterns:
          - pattern: filepath.IsLocal($X)
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.OpenFile($PATH, ...)
              - pattern: os.RemoveAll($PATH)
              - pattern: os.WriteFile($PATH, ...)
              - pattern: os.Create($PATH)
              - pattern: os.Remove($PATH)
              - pattern: os.Mkdir($PATH, ...)
              - pattern: os.MkdirAll($PATH, ...)
          - focus-metavariable: $PATH
