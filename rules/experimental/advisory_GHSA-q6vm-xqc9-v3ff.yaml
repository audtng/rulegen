rules:
  - id: archive-zip-slip
    mode: taint
    severity: ERROR
    message: "Untrusted archive entry path used in file system operation without sanitization can lead to directory traversal (Zip Slip)."
    languages:
      - go
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp:
        - "A01:2021 - Broken Access Control"
        - "A05:2017 - Broken Access Control"
      category: security
      technology:
        - go
      references:
        - "https://cwe.mitre.org/data/definitions/22.html"
        - "https://owasp.org/www-community/attacks/Path_Traversal"
        - "https://snyk.io/research/zip-slip-vulnerability"
    paths:
      exclude:
        - "*_test.go"
        - "test/**/*.go"
        - "mock/**/*.go"
    options:
      taint_assume_safe_booleans: true
    pattern-sources:
      - pattern: "($FILE : *zip.File).Name"
      - pattern: "($FILE : zip.File).Name"
      - pattern: "($HDR : *zip.FileHeader).Name"
      - pattern: "($HDR : zip.FileHeader).Name"
      - pattern: "($HDR : *tar.Header).Name"
      - pattern: "($HDR : tar.Header).Name"
      - pattern: "($R : *zip.Reader).File"
      - pattern: "($R : zip.Reader).File"
      - pattern: "($TR : *tar.Reader).Next()"
      - pattern: "($TR : tar.Reader).Next()"
    pattern-propagators:
      - from: $FROM
        to: filepath.Join(...)
        patterns:
          - pattern: filepath.Join(..., $FROM, ...)
      - from: $FROM
        to: path.Join(...)
        patterns:
          - pattern: path.Join(..., $FROM, ...)
      - from: $FROM
        to: filepath.Clean(...)
        patterns:
          - pattern: filepath.Clean($FROM)
      - from: $FROM
        to: path.Clean(...)
        patterns:
          - pattern: path.Clean($FROM)
      - from: $FROM
        to: filepath.Dir(...)
        patterns:
          - pattern: filepath.Dir($FROM)
      - from: $FROM
        to: path.Dir(...)
        patterns:
          - pattern: path.Dir($FROM)
      - from: $FROM
        to: filepath.FromSlash(...)
        patterns:
          - pattern: filepath.FromSlash($FROM)
      - from: $FROM
        to: filepath.ToSlash(...)
        patterns:
          - pattern: filepath.ToSlash($FROM)
      - from: $FROM
        to: fmt.Sprintf(...)
        patterns:
          - pattern: fmt.Sprintf(..., $FROM, ...)
    pattern-sanitizers:
      - pattern: filepath.Base(...)
      - pattern: path.Base(...)
      - by-side-effect: true
        patterns:
          - pattern: filepath.IsLocal($X)
          - focus-metavariable: $X
      - by-side-effect: true
        patterns:
          - pattern: strings.HasPrefix($X, ...)
          - focus-metavariable: $X
      - by-side-effect: true
        patterns:
          - pattern: strings.Contains($X, ...)
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.OpenFile($PATH, ...)
              - pattern: os.Create($PATH)
              - pattern: os.CreateTemp($PATH, ...)
              - pattern: os.Mkdir($PATH, ...)
              - pattern: os.MkdirAll($PATH, ...)
              - pattern: os.WriteFile($PATH, ...)
              - pattern: os.Remove($PATH)
              - pattern: os.RemoveAll($PATH)
              - pattern: os.Truncate($PATH, ...)
          - focus-metavariable: $PATH
