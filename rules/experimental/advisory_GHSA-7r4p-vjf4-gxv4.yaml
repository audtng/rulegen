rules:
  - id: http-reverse-proxy-unstripped-identity-headers
    mode: search
    languages:
      - go
    severity: ERROR
    message: "Detected conditional setting of HTTP identity or authentication headers on a request without stripping or deleting incoming client-supplied headers first. In reverse proxies or forward authentication middleware, failing to delete client-supplied headers (e.g. via Header.Del) before conditionally setting them allows an attacker to inject spoofed identity headers (such as Remote-User, X-Remote-User, or X-Forwarded-User) when the authentication provider returns an empty value or omits the header."
    metadata:
      cwe:
        - "CWE-287: Improper Authentication"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      category: security
      confidence: HIGH
      references:
        - "https://cwe.mitre.org/data/definitions/287.html"
        - "https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/"
    paths:
      exclude:
        - "*_test.go"
        - "test/**/*.go"
        - "mock/**/*.go"
    patterns:
      - pattern-either:
          # Conditionally setting identity header without prior Del or else Del
          - patterns:
              - pattern: |
                  if $COND {
                      ...
                      $REQ.Header.Set($HEADER, ...)
                      ...
                  }
              - metavariable-regex:
                  metavariable: $HEADER
                  regex: (?i)^"(remote-user|remote-groups|remote-email|remote-name|x-remote-user|x-remote-groups|x-remote-email|x-remote-name|x-forwarded-user|x-forwarded-groups|x-forwarded-email|x-auth-request-user|x-auth-request-email|x-auth-request-groups|x-webauth-user)"$
              - pattern-not-inside: |
                  $REQ.Header.Del(...)
                  ...
                  if $COND { ... }
              - pattern-not: |
                  if $COND {
                      ...
                  } else {
                      ...
                      $REQ.Header.Del(...)
                      ...
                  }
