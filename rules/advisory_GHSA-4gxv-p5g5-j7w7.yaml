rules:
  - id: go-arbitrary-file-write
    languages:
      - go
    severity: ERROR
    message: >-
      Untrusted user input from an HTTP request reaches a filesystem write sink without
      sufficient path containment or validation. An attacker can exploit directory traversal
      sequences to write or overwrite arbitrary files on the host filesystem. Use
      filepath.IsLocal or filepath.Base to ensure the target path remains safely contained
      within the intended directory.
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
        - "CWE-73: External Control of File Name or Path"
      owasp:
        - "A01:2021 - Broken Access Control"
      category: security
      technology:
        - go
      subcategory:
        - vuln
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      references:
        - "https://nvd.nist.gov/vuln/detail/CVE-2026-49340"
        - "https://github.com/advisories/GHSA-4gxv-p5g5-j7w7"
    mode: taint
    paths:
      exclude: ["*_test.go", "test/**/*.go", "mock/**/*.go"]
    options:
      taint_assume_safe_booleans: true
      taint_assume_safe_numbers: true
    pattern-sources:
      - pattern: "($REQ : *http.Request).URL.Query().Get(...)"
      - pattern: "($REQ : *http.Request).URL.Query()[...]"
      - pattern: "($REQ : *http.Request).FormValue(...)"
      - pattern: "($REQ : *http.Request).PostFormValue(...)"
      - pattern: "($REQ : *http.Request).Header.Get(...)"
      - pattern: "($REQ : *http.Request).Cookie(...)"
      - pattern: "($REQ : *http.Request).URL.Path"
      - pattern: "($REQ : *http.Request).URL.RawQuery"
    pattern-propagators:
      - pattern: filepath.Join(..., $FROM, ...)
        from: $FROM
        to: filepath.Join(...)
      - pattern: path.Join(..., $FROM, ...)
        from: $FROM
        to: path.Join(...)
      - pattern: filepath.Clean($FROM)
        from: $FROM
        to: filepath.Clean($FROM)
      - pattern: path.Clean($FROM)
        from: $FROM
        to: path.Clean($FROM)
      - pattern: fmt.Sprintf(..., $FROM, ...)
        from: $FROM
        to: fmt.Sprintf(...)
      - pattern: fmt.Sprint(..., $FROM, ...)
        from: $FROM
        to: fmt.Sprint(...)
    pattern-sanitizers:
      - patterns:
          - pattern: filepath.IsLocal($PATH)
          - focus-metavariable: $PATH
        by-side-effect: true
      - pattern: filepath.Base(...)
      - pattern: path.Base(...)
    pattern-sinks:
      - pattern: os.Create($PATH)
        focus-metavariable: $PATH
      - pattern: os.OpenFile($PATH, ...)
        focus-metavariable: $PATH
      - pattern: os.WriteFile($PATH, ...)
        focus-metavariable: $PATH
      - pattern: ioutil.WriteFile($PATH, ...)
        focus-metavariable: $PATH
      - pattern: os.CreateTemp($DIR, ...)
        focus-metavariable: $DIR
