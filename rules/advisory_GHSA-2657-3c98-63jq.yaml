rules:
  - id: archive-path-traversal
    mode: taint
    severity: ERROR
    message: >-
      Untrusted file path from an archive header is used in a file system operation without proper
      validation or sanitization. This can lead to arbitrary file writes or directory traversal (Zip Slip).
      Validate paths using filepath.IsLocal or sanitize them using filepath.Base.
    languages:
      - go
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp:
        - "A01:2021 - Broken Access Control"
      category: security
      technology:
        - go
      confidence: HIGH
      references:
        - https://cwe.mitre.org/data/definitions/22.html
        - https://owasp.org/www-community/attacks/Path_Traversal
        - https://snyk.io/research/zip-slip-vulnerability
    paths:
      exclude:
        - "*_test.go"
        - "test/**/*.go"
        - "mock/**/*.go"
    options:
      taint_assume_safe_booleans: true
    pattern-sources:
      - pattern: "($H : *tar.Header).Name"
      - pattern: "($H : tar.Header).Name"
      - pattern: "($F : *zip.File).Name"
      - pattern: "($F : zip.File).Name"
      - pattern: "($FH : *zip.FileHeader).Name"
      - pattern: "($FH : zip.FileHeader).Name"
      - pattern: "($TR : *tar.Reader).Next()"
      - pattern: "($TR : tar.Reader).Next()"
      - pattern: "($ZR : *zip.Reader).File"
      - pattern: "($ZR : zip.Reader).File"
      - pattern: "($ZR : *zip.ReadCloser).File"
      - pattern: "($ZR : zip.ReadCloser).File"
      - patterns:
          - pattern-either:
              - pattern: "$HDR, $ERR = $TR.Next()"
              - pattern: "$HDR, $ERR := $TR.Next()"
          - pattern-either:
              - pattern-inside: |
                  $TR := tar.NewReader(...)
                  ...
              - pattern-inside: |
                  $TR = tar.NewReader(...)
                  ...
          - focus-metavariable: $HDR
    pattern-propagators:
      - from: $FROM
        to: filepath.Join(...)
        patterns:
          - pattern: filepath.Join(..., $FROM, ...)
      - from: $FROM
        to: path.Join(...)
        patterns:
          - pattern: path.Join(..., $FROM, ...)
      - from: $FROM
        to: filepath.Clean(...)
        patterns:
          - pattern: filepath.Clean($FROM)
      - from: $FROM
        to: path.Clean(...)
        patterns:
          - pattern: path.Clean($FROM)
    pattern-sanitizers:
      - pattern: filepath.Base(...)
      - pattern: path.Base(...)
      - by-side-effect: true
        patterns:
          - pattern: filepath.IsLocal($X)
          - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.OpenFile($PATH, ...)
              - pattern: os.Create($PATH)
              - pattern: os.WriteFile($PATH, ...)
              - pattern: ioutil.WriteFile($PATH, ...)
              - pattern: os.Mkdir($PATH, ...)
              - pattern: os.MkdirAll($PATH, ...)
              - pattern: os.Remove($PATH)
              - pattern: os.RemoveAll($PATH)
          - focus-metavariable: $PATH
