rules:
  - id: go-path-traversal-file-write
    mode: taint
    message: >-
      Untrusted input reaches a file system write or creation operation without proper
      containment. Functions such as 'filepath.Join', 'path.Join', or 'path.Clean' do not
      prevent directory traversal outside the target directory. Verify path containment
      using 'filepath.IsLocal' (Go 1.20+) or check that the resolved path is rooted within
      the target directory using 'strings.HasPrefix'.
    severity: ERROR
    languages:
      - go
    paths:
      exclude: ["*_test.go", "test/**/*.go", "mock/**/*.go"]
    options:
      taint_assume_safe_booleans: true
      taint_assume_safe_numbers: true
    pattern-sources:
      - pattern: '($REQ : *http.Request).URL.Query().Get(...)'
      - pattern: '($REQ : *http.Request).URL.Query()[...]'
      - pattern: '($REQ : *http.Request).FormValue(...)'
      - pattern: '($REQ : *http.Request).PostFormValue(...)'
      - pattern: '($REQ : *http.Request).PathValue(...)'
      - pattern: '($REQ : *http.Request).Header.Get(...)'
      - pattern: '($H : *tar.Header).Name'
      - pattern: '($H : tar.Header).Name'
      - pattern: '($TR : *tar.Reader).Next()'
      - pattern: '($F : *zip.File).Name'
      - pattern: '($FH : *zip.FileHeader).Name'
      - pattern: '($CTX : *gin.Context).Query(...)'
      - pattern: '($CTX : *gin.Context).Param(...)'
      - pattern: '($CTX : *gin.Context).PostForm(...)'
      - pattern: '($CTX : echo.Context).FormValue(...)'
      - pattern: '($CTX : echo.Context).QueryParam(...)'
      - pattern: '($CTX : *fiber.Ctx).Query(...)'
      - pattern: '($CTX : *fiber.Ctx).Params(...)'
    pattern-propagators:
      - pattern: filepath.Join(..., $FROM, ...)
        from: $FROM
        to: filepath.Join(...)
      - pattern: path.Join(..., $FROM, ...)
        from: $FROM
        to: path.Join(...)
      - pattern: filepath.Clean($FROM)
        from: $FROM
        to: filepath.Clean(...)
      - pattern: path.Clean($FROM)
        from: $FROM
        to: path.Clean(...)
      - pattern: fmt.Sprintf(..., $FROM, ...)
        from: $FROM
        to: fmt.Sprintf(...)
      - pattern: fmt.Sprint(..., $FROM, ...)
        from: $FROM
        to: fmt.Sprint(...)
      - pattern: strings.TrimPrefix($FROM, ...)
        from: $FROM
        to: strings.TrimPrefix(...)
      - pattern: strings.TrimSuffix($FROM, ...)
        from: $FROM
        to: strings.TrimSuffix(...)
      - pattern: strings.ReplaceAll($FROM, ...)
        from: $FROM
        to: strings.ReplaceAll(...)
      - pattern: filepath.Dir($FROM)
        from: $FROM
        to: filepath.Dir(...)
      - pattern: path.Dir($FROM)
        from: $FROM
        to: path.Dir(...)
    pattern-sanitizers:
      - patterns:
          - pattern: filepath.IsLocal($VAR)
          - focus-metavariable: $VAR
        by-side-effect: true
      - patterns:
          - pattern: fs.ValidPath($VAR)
          - focus-metavariable: $VAR
        by-side-effect: true
      - patterns:
          - pattern: io/fs.ValidPath($VAR)
          - focus-metavariable: $VAR
        by-side-effect: true
      - patterns:
          - pattern: strings.HasPrefix($VAR, ...)
          - focus-metavariable: $VAR
        by-side-effect: true
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.OpenFile($PATH, ...)
              - pattern: os.Create($PATH)
              - pattern: os.CreateTemp($PATH, ...)
              - pattern: os.WriteFile($PATH, ...)
              - pattern: os.Mkdir($PATH, ...)
              - pattern: os.MkdirAll($PATH, ...)
              - pattern: os.Remove($PATH)
              - pattern: os.RemoveAll($PATH)
              - pattern: ioutil.WriteFile($PATH, ...)
          - focus-metavariable: $PATH
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp:
        - "A01:2021 - Broken Access Control"
      category: security
      technology:
        - go
        - net/http
        - gin
        - echo
        - fiber
      confidence: HIGH
