rules:
  - id: path-traversal-filesystem
    mode: taint
    severity: ERROR
    message: >-
      Untrusted user input flows into a filesystem operation without
      proper path traversal containment. An attacker can supply path traversal
      sequences (such as '..') to access, create, or delete arbitrary files
      and directories outside the intended base directory. Validate the input
      using containment checks such as filepath.IsLocal() or fs.ValidPath().
    languages:
      - go
    paths:
      exclude: ["*_test.go", "test/**/*.go", "mock/**/*.go"]
    options:
      taint_assume_safe_booleans: true
      taint_assume_safe_numbers: true
    pattern-sources:
      - pattern: '($REQ : *http.Request).URL.Query().Get(...)'
      - pattern: '($REQ : *http.Request).FormValue(...)'
      - pattern: '($REQ : *http.Request).PostFormValue(...)'
      - pattern: '($REQ : *http.Request).URL.Path'
      - pattern: '($REQ : *http.Request).URL.RawQuery'
      - pattern: '($REQ : *http.Request).Header.Get(...)'
      - pattern: '($REQ : *http.Request).Cookie(...)'
      - pattern: '($CTX : *gin.Context).Query(...)'
      - pattern: '($CTX : *gin.Context).Param(...)'
      - pattern: '($CTX : *gin.Context).PostForm(...)'
      - pattern: '($CTX : echo.Context).FormValue(...)'
      - pattern: '($CTX : echo.Context).QueryParam(...)'
      - pattern: '($CTX : *fiber.Ctx).Query(...)'
      - pattern: '($CTX : *fiber.Ctx).Params(...)'
    pattern-propagators:
      - from: $FROM
        to: $TO
        patterns:
          - pattern-either:
              - pattern: $TO = filepath.Join(..., $FROM, ...)
              - pattern: $TO := filepath.Join(..., $FROM, ...)
              - pattern: $TO = filepath.Clean($FROM)
              - pattern: $TO := filepath.Clean($FROM)
              - pattern: $TO = path.Join(..., $FROM, ...)
              - pattern: $TO := path.Join(..., $FROM, ...)
              - pattern: $TO = path.Clean($FROM)
              - pattern: $TO := path.Clean($FROM)
              - pattern: $TO = fmt.Sprintf(..., $FROM, ...)
              - pattern: $TO := fmt.Sprintf(..., $FROM, ...)
              - pattern: $TO = fmt.Sprint(..., $FROM, ...)
              - pattern: $TO := fmt.Sprint(..., $FROM, ...)
              - pattern: $TO = strings.TrimPrefix($FROM, ...)
              - pattern: $TO := strings.TrimPrefix($FROM, ...)
              - pattern: $TO = strings.TrimSuffix($FROM, ...)
              - pattern: $TO := strings.TrimSuffix($FROM, ...)
              - pattern: $TO = strings.Trim($FROM, ...)
              - pattern: $TO := strings.Trim($FROM, ...)
              - pattern: $TO = strings.TrimSpace($FROM)
              - pattern: $TO := strings.TrimSpace($FROM)
              - pattern: $TO, $ERR = filepath.Abs($FROM)
              - pattern: $TO, $ERR := filepath.Abs($FROM)
              - pattern: $TO, $ERR = filepath.Rel(..., $FROM)
              - pattern: $TO, $ERR := filepath.Rel(..., $FROM)
    pattern-sanitizers:
      - by-side-effect: true
        patterns:
          - pattern-either:
              - pattern: filepath.IsLocal($VAR)
              - pattern: fs.ValidPath($VAR)
              - pattern: io/fs.ValidPath($VAR)
          - focus-metavariable: $VAR
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.Open($VAR)
              - pattern: os.OpenFile($VAR, ...)
              - pattern: os.Create($VAR)
              - pattern: os.CreateTemp($VAR, ...)
              - pattern: os.ReadFile($VAR)
              - pattern: os.WriteFile($VAR, ...)
              - pattern: os.Remove($VAR)
              - pattern: os.RemoveAll($VAR)
              - pattern: os.Mkdir($VAR, ...)
              - pattern: os.MkdirAll($VAR, ...)
              - pattern: os.MkdirTemp($VAR, ...)
              - pattern: os.Stat($VAR)
              - pattern: os.Lstat($VAR)
              - pattern: os.Truncate($VAR, ...)
              - pattern: os.ReadDir($VAR)
              - pattern: os.DirFS($VAR)
              - pattern: os.Rename($VAR, ...)
              - pattern: os.Rename(..., $VAR)
              - pattern: http.Dir($VAR)
              - pattern: ioutil.ReadFile($VAR)
              - pattern: ioutil.WriteFile($VAR, ...)
              - pattern: ioutil.ReadDir($VAR)
          - focus-metavariable: $VAR
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
      owasp:
        - "A01:2021 - Broken Access Control"
      category: security
      technology:
        - go
      confidence: HIGH
