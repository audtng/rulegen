rules:
  - id: path-traversal-filesystem
    mode: taint
    languages:
      - go
    severity: ERROR
    message: >-
      Untrusted user input from an HTTP request reaches a filesystem operation
      without proper path containment validation. Functions such as filepath.Join
      and filepath.Clean do not prevent directory traversal outside of the intended
      base directory. An attacker can supply path traversal sequences (e.g., '..')
      to create, read, write, or delete arbitrary files or directories. Validate
      user-controlled paths using real containment controls such as filepath.IsLocal
      or io/fs.ValidPath, or verify that the resolved target path is contained within
      the intended base directory.
    metadata:
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory ('Path Traversal')"
        - "CWE-73: External Control of File Name or Path"
      owasp:
        - "A01:2021 - Broken Access Control"
      category: security
      technology:
        - go
      confidence: HIGH
      subcategory:
        - vuln
    paths:
      exclude: ["*_test.go", "test/**/*.go", "mock/**/*.go"]
    options:
      taint_assume_safe_booleans: true
      taint_assume_safe_numbers: true
    pattern-sources:
      - pattern: '($REQ : *http.Request).URL.Query().Get(...)'
      - pattern: '($REQ : *http.Request).FormValue(...)'
      - pattern: '($REQ : *http.Request).PostFormValue(...)'
      - pattern: '($REQ : *http.Request).PathValue(...)'
      - pattern: '($REQ : *http.Request).Header.Get(...)'
      - pattern: '($REQ : *http.Request).URL.Path'
      - pattern: '($REQ : *http.Request).URL.RawQuery'
      - pattern: '($CTX : *gin.Context).Query(...)'
      - pattern: '($CTX : *gin.Context).Param(...)'
      - pattern: '($CTX : *gin.Context).PostForm(...)'
      - pattern: '($CTX : echo.Context).FormValue(...)'
      - pattern: '($CTX : echo.Context).QueryParam(...)'
      - pattern: '($CTX : *fiber.Ctx).Query(...)'
      - pattern: '($CTX : *fiber.Ctx).Params(...)'
    pattern-sanitizers:
      - by-side-effect: true
        patterns:
          - pattern: filepath.IsLocal($VAR)
          - focus-metavariable: $VAR
      - by-side-effect: true
        patterns:
          - pattern: fs.ValidPath($VAR)
          - focus-metavariable: $VAR
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.OpenFile($VAR, ...)
              - pattern: os.Open($VAR)
              - pattern: os.Create($VAR)
              - pattern: os.CreateTemp($VAR, ...)
              - pattern: os.ReadFile($VAR)
              - pattern: os.WriteFile($VAR, ...)
              - pattern: os.Remove($VAR)
              - pattern: os.RemoveAll($VAR)
              - pattern: os.Mkdir($VAR, ...)
              - pattern: os.MkdirAll($VAR, ...)
              - pattern: os.Truncate($VAR, ...)
              - pattern: os.ReadDir($VAR)
              - pattern: os.DirFS($VAR)
              - pattern: os.Chmod($VAR, ...)
              - pattern: os.Chown($VAR, ...)
              - pattern: os.Lchown($VAR, ...)
              - pattern: os.Chtimes($VAR, ...)
              - pattern: os.Rename($VAR, ...)
              - pattern: os.Rename(..., $VAR)
              - pattern: ioutil.ReadFile($VAR)
              - pattern: ioutil.WriteFile($VAR, ...)
              - pattern: ioutil.ReadDir($VAR)
              - pattern: ioutil.TempFile($VAR, ...)
              - pattern: ioutil.TempDir($VAR, ...)
          - focus-metavariable: $VAR
