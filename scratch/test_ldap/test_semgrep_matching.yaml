rules:
  - id: ldap-improper-authentication
    mode: search
    languages:
      - go
    severity: ERROR
    message: "Detected improper LDAP authentication or unauthenticated bind."
    metadata:
      cwe:
        - "CWE-287: Improper Authentication"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      category: security
      confidence: HIGH
      references:
        - "https://cwe.mitre.org/data/definitions/287.html"
        - "https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/"
    paths:
      exclude:
        - "*_test.go"
        - "test/**/*.go"
        - "mock/**/*.go"
    patterns:
      - pattern-either:
          - pattern: $CONN.UnauthenticatedBind(...)
          - pattern: $CONN.Bind($USER, "")
          - pattern: $CONN.Bind("", $PASS)
          - pattern: $CONN.Bind("", "")
          - pattern: ldap.NewSimpleBindRequest($USER, "", ...)
          - pattern: NewSimpleBindRequest($USER, "", ...)
          - pattern: |
              &ldap.SimpleBindRequest{
                ...,
                Password: "",
                ...
              }
          - pattern: |
              ldap.SimpleBindRequest{
                ...,
                Password: "",
                ...
              }
          - pattern: |
              &SimpleBindRequest{
                ...,
                Password: "",
                ...
              }
          - pattern: |
              SimpleBindRequest{
                ...,
                Password: "",
                ...
              }
          - pattern: _ = $CONN.Bind(...)
          - pattern: _ = $CONN.SimpleBind(...)
          - patterns:
              - pattern: $ERR := $CONN.Bind(...)
              - pattern-not-inside: |
                  $ERR := $CONN.Bind(...)
                  ...
                  if $ERR != nil { ... }
              - pattern-not-inside: |
                  $ERR := $CONN.Bind(...)
                  ...
                  if $ERR == nil { ... }
              - pattern-not-inside: |
                  $ERR := $CONN.Bind(...)
                  ...
                  return ...
          - patterns:
              - pattern: $ERR = $CONN.Bind(...)
              - pattern-not-inside: |
                  $ERR = $CONN.Bind(...)
                  ...
                  if $ERR != nil { ... }
              - pattern-not-inside: |
                  $ERR = $CONN.Bind(...)
                  ...
                  if $ERR == nil { ... }
              - pattern-not-inside: |
                  $ERR = $CONN.Bind(...)
                  ...
                  return ...
          - patterns:
              - pattern: |
                  if $ERR != nil {
                      ...
                      http.Error($W, $MSG, $CODE)
                      ...
                  }
              - pattern-inside: |
                  $ERR := $CONN.Bind(...)
                  ...
              - pattern-not: |
                  if $ERR != nil {
                      ...
                      return ...
                  }
              - metavariable-regex:
                  metavariable: $CODE
                  regex: ^(http\.StatusUnauthorized|http\.StatusForbidden|401|403)$
          - patterns:
              - pattern: |
                  if $ERR != nil {
                      ...
                      $W.WriteHeader($CODE)
                      ...
                  }
              - pattern-inside: |
                  $ERR := $CONN.Bind(...)
                  ...
              - pattern-not: |
                  if $ERR != nil {
                      ...
                      return ...
                  }
              - metavariable-regex:
                  metavariable: $CODE
                  regex: ^(http\.StatusUnauthorized|http\.StatusForbidden|401|403)$
          - patterns:
              - pattern: |
                  if $ERR := $CONN.Bind(...); $ERR != nil {
                      ...
                      http.Error($W, $MSG, $CODE)
                      ...
                  }
              - pattern-not: |
                  if $ERR := $CONN.Bind(...); $ERR != nil {
                      ...
                      return ...
                  }
              - metavariable-regex:
                  metavariable: $CODE
                  regex: ^(http\.StatusUnauthorized|http\.StatusForbidden|401|403)$
          - patterns:
              - pattern: |
                  if $ERR := $CONN.Bind(...); $ERR != nil {
                      ...
                      $W.WriteHeader($CODE)
                      ...
                  }
              - pattern-not: |
                  if $ERR := $CONN.Bind(...); $ERR != nil {
                      ...
                      return ...
                  }
              - metavariable-regex:
                  metavariable: $CODE
                  regex: ^(http\.StatusUnauthorized|http\.StatusForbidden|401|403)$
