rules:
  - id: jwt-empty-secret-authentication-bypass
    mode: search
    languages:
      - go
    severity: ERROR
    message: "Detected JWT authentication with an empty or nil key/secret, or ignored JWT parsing errors. Validating or signing tokens with an empty secret allows unauthorized attackers to forge tokens and bypass authentication."
    metadata:
      cwe:
        - "CWE-287: Improper Authentication"
        - "CWE-347: Improper Verification of Cryptographic Signature"
      owasp:
        - "A07:2021 - Identification and Authentication Failures"
      category: security
      confidence: HIGH
      references:
        - "https://cwe.mitre.org/data/definitions/287.html"
        - "https://cwe.mitre.org/data/definitions/347.html"
        - "https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/"
    paths:
      exclude:
        - "*_test.go"
        - "test/**/*.go"
        - "mock/**/*.go"
    patterns:
      - pattern-either:
          - pattern: |
              func($T *jwt.Token) (interface{}, error) {
                  ...
                  return []byte(""), nil
              }
          - pattern: |
              func($T *jwt.Token) (interface{}, error) {
                  ...
                  return []byte{}, nil
              }
          - pattern: |
              func($T *jwt.Token) (interface{}, error) {
                  ...
                  return "", nil
              }
          - pattern: |
              func($T *jwt.Token) (interface{}, error) {
                  ...
                  return nil, nil
              }
          - pattern: $TOKEN.SignedString([]byte(""))
          - pattern: $TOKEN.SignedString("")
          - pattern: $TOKEN.SignedString([]byte{})
          - pattern: |
              jwt.Parse($TOKEN, func($T *jwt.Token) (interface{}, error) {
                  return []byte(""), nil
              })
          - pattern: |
              jwt.ParseWithClaims($TOKEN, $CLAIMS, func($T *jwt.Token) (interface{}, error) {
                  return []byte(""), nil
              })
          - pattern: |
              jwt.Parse($TOKEN, func($T *jwt.Token) (interface{}, error) {
                  return nil, nil
              })
          - pattern: |
              jwt.ParseWithClaims($TOKEN, $CLAIMS, func($T *jwt.Token) (interface{}, error) {
                  return nil, nil
              })
          - pattern: $TOKEN, _ := jwt.Parse(...)
          - pattern: $TOKEN, _ = jwt.Parse(...)
          - pattern: $TOKEN, _ := jwt.ParseWithClaims(...)
          - pattern: $TOKEN, _ = jwt.ParseWithClaims(...)
