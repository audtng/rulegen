rules:
  - id: oauth-email-verification-bypass
    mode: search
    languages: [go]
    severity: ERROR
    message: "Test message"
    metadata:
      cwe: ["CWE-287"]
    patterns:
      - pattern-either:
          - pattern: 'EmailVerified: $EMAIL != ""'
          - pattern: '$P.EmailVerified = $EMAIL != ""'
